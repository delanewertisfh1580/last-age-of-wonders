name: Traceability Map

# Запуск только вручную: карта трассировки публикуется по решению человека,
# а не на каждый push (визуализация — отчётный артефакт, не проверка кода).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Сборка трассировки .workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Зависимости (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Сборка визуализации (INTENT → DESIGN → DEV-SPEC → TICKET)
        run: |
          bun run trace:build | tee trace-build.log
          {
            echo "### Трассировка документации"
            echo ""
            echo '```'
            cat trace-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Разрывы не блокируют публикацию: карта должна показывать и проблемы.
      - name: Проверка разрывов (advisory)
        continue-on-error: true
        run: bun run trace:check

      - name: Загрузка артефакта GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: trace/dist

  deploy:
    name: Публикация на GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
